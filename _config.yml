title: WebberZone ChatGPT Account
description: Documentation for WebberZone ChatGPT Account — use your ChatGPT subscription in the WordPress AI Client.
url: https://webberzone.github.io
baseurl: /webberzone-chatgpt-account

plugin_name: WebberZone ChatGPT Account
plugin_slug: webberzone-chatgpt-account

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - build
  - phpunit
  - phpcompat-tools
  - includes
  - languages
  - uninstall.php
  - assets
  - build-zip.sh
  - composer.json
  - composer.lock
  - readme.txt
  - changelog.txt
  - phpstan-bootstrap.php
  - "*.php"
  - "*.dist"
  - "*.neon"
  - README.md
  - AGENTS.md
  - CLAUDE.md
